<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoopGestión — Sistema de Gestión Cooperativa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M3 12h18"/><path d="m4.93 4.93 14.14 14.14"/></svg>
        </div>
        <div><h1>CoopGestión</h1><div class="muted">Acceso al sistema</div></div>
      </div>
      <form id="login-form" class="login-form">
        <label>Usuario<input id="login-user" autocomplete="username" placeholder="Usuario" required></label>
        <label>Contraseña<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Iniciar sesión</button>
      </form>
      <div id="login-error" class="login-error" role="alert"></div>
    </div>
  </section>

  <main id="app" class="app hidden">
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden" tabindex="-1"></div>
    <div class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M3 12h18"/><path d="m4.93 4.93 14.14 14.14"/></svg>
          </div>
          <div><strong>CoopGestión</strong><div id="sidebar-subtitle" class="helper"></div></div>
        </div>
        <nav id="nav" class="nav" aria-label="Navegación principal"></nav>
      </aside>
      <section class="content">
        <div class="topbar">
          <div class="topbar-left">
            <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Abrir navegación" aria-expanded="false" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div>
              <div id="eyebrow" class="eyebrow">Cooperativa de Trabajo</div>
              <h1 id="page-title"></h1>
            </div>
          </div>
          <div class="user">
            <div id="user-avatar" class="avatar">A</div>
            <div><strong id="user-name"></strong><small id="user-role" class="muted"></small></div>
          </div>
        </div>
        <div id="status" class="status hidden" role="status"></div>

        <section id="admin-inicio" class="panel"></section>
        <section id="admin-socios" class="panel"></section>
        <section id="admin-trabajo" class="panel"></section>
        <section id="admin-retribuciones" class="panel"></section>
        <section id="admin-finanzas" class="panel"></section>
        <section id="admin-retiros" class="panel"></section>
        <section id="admin-fondos" class="panel"></section>
        <section id="admin-reporte" class="panel"></section>
        <section id="admin-asamblea" class="panel"></section>
        <section id="admin-historial" class="panel"></section>

        <section id="assoc-inicio" class="panel"></section>
        <section id="assoc-perfil" class="panel"></section>
        <section id="assoc-horas" class="panel"></section>
        <section id="assoc-retribucion" class="panel"></section>
        <section id="assoc-asamblea" class="panel"></section>
      </section>
    </div>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}</script>
  <script src="/app.js"></script>
</body>
</html>
